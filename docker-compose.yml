version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hercycle
      POSTGRES_PASSWORD: hercycle
      POSTGRES_DB: hercycle
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hercycle:hercycle@db:5432/hercycle?schema=public
    depends_on: [db]
volumes:
  pgdata:
